format = """
[░▒▓](#a02c3c)\
[ 󰣇 ](bg:#a02c3c fg:#0b0b0f)\
[](fg:#a02c3c bg:#14141b)\
$directory\
[](fg:#14141b bg:#23232e)\
$git_branch\
$git_status\
[](fg:#23232e bg:#2a2a35)\
$nodejs\
$rust\
$python\
[](fg:#2a2a35 bg:#0b0b0f)\
\n$character"""

[directory]
style = "bg:#14141b fg:#d8d3c8"
format = "[ $path ]($style)"
truncation_length = 3

[git_branch]
symbol = ""
style = "bg:#23232e fg:#d8d3c8"
format = "[[ $symbol $branch ]($style)]"

[git_status]
style = "bg:#23232e fg:#d8d3c8"
format = "[[($all_status$ahead_behind )]($style)]"

[character]
success_symbol = "[󰄛 ](bold #c9a227)"
error_symbol = "[󰄛 ](bold #c84a58)"
