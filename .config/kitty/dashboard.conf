# ============================================================
#  Dashboard-only palette  (Mod+V window)
#
#  A deliberate hybrid: it keeps Cathedral's near-black ground and
#  bone text so the window still belongs to the theme, but restores
#  a vivid ANSI set. Desaturated gothic hues make graphs and gauges
#  muddy -- data visualisation needs hues you can tell apart.
#
#  Only the Mod+V dashboard uses this. Every other terminal stays
#  on the gothic palette in kitty.conf.
# ============================================================

include kitty.conf

# --- Cathedral ground kept, so it reads as the same desktop -----
background            #0b0b0f
foreground            #d8d3c8
cursor                #7dcfff
cursor_text_color     #0b0b0f
selection_background  #2d3f76
active_border_color   #7aa2f7

# --- Vivid ANSI: the part that was "much better" ----------------
# black
color0  #0b0b0f
color8  #414868
# red
color1  #f7768e
color9  #ff899d
# green
color2  #9ece6a
color10 #b9f27c
# yellow
color3  #e0af68
color11 #ffc777
# blue
color4  #7aa2f7
color12 #8db0ff
# magenta
color5  #bb9af7
color13 #caa9fa
# cyan  (tty-clock runs with -C 6, so this is the clock colour)
color6  #7dcfff
color14 #b4f9f8
# white — bone, not #ffffff, keeping the gothic text tone
color7  #d8d3c8
color15 #efe9dd
