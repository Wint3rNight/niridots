# Make Spotify always follow the default output device.
#
# THE BUG THIS FIXES: switching the output device in the DMS media panel had no
# effect on Spotify, while Zen followed correctly. The panel calls
# AudioService.setSink() -> Pipewire.preferredDefaultAudioSink, which only sets
# the *default sink*. That moves any stream that has no explicit target. But
# WirePlumber had a saved target for Spotify:
#
#   Output/Audio:application.name:Spotify={... "target":"...HiFi__Speaker__sink"}
#
# and re-applied it as target.object on Spotify's node, overriding the default.
# Zen's saved entry had no "target" key, which is why only Spotify was stuck.
#
# The pin was self-inflicted and self-reinforcing: node.stream.restore-target
# defaults to true, so every manual move in pavucontrol - the workaround - saved
# the pin again and made it permanent.
#
# state.restore-target = false makes state-stream.lua skip Spotify in BOTH the
# restore path (line 143) and the save path (line 289), so no pin can come back
# even if the stream is moved by hand. Every other app keeps normal per-app
# pinning; this rule is deliberately scoped to Spotify only.

stream.rules = [
  {
    matches = [
      {
        application.name = "Spotify"
      }
    ]
    actions = {
      update-props = {
        state.restore-target = "false"
      }
    }
  }
]
